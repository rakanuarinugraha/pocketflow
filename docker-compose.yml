services:
  postgres:
    image: postgres:16-alpine
    container_name: pocketflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pocketflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      - pocketflow_postgres_data:/var/lib/postgresql/data

volumes:
  pocketflow_postgres_data:
